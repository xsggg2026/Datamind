name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest tests -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.11.1
      - name: Build single-file executable
        run: |
          pyinstaller --noconfirm --onefile --name "DataMind" `
            --collect-submodules numpy `
            --collect-submodules pandas `
            --collect-submodules openpyxl `
            --add-data "templates;templates" `
            --add-data "static;static" `
            web_portal.py
      - name: Rename artifact
        run: |
          Move-Item dist/DataMind.exe "DataMind-${{ github.ref_name }}-windows-x64.exe"
          Move-Item "DataMind-${{ github.ref_name }}-windows-x64.exe" dist/
      - name: Package exe with user guide
        run: |
          Copy-Item "USER_GUIDE.txt" "dist/USER_GUIDE.txt"
          $zip = "DataMind-${{ github.ref_name }}-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory("$PWD/dist", "$PWD/$zip")
          Get-Item $zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/DataMind-*-windows-x64.exe
            DataMind-*-windows-x64.zip

  build-macos:
    needs: test
    # Apple Silicon only: GitHub retired the free Intel (macos-13) runner image;
    # Intel macOS builds now require paid "larger runners".
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.11.1
      - name: Build macOS app bundle
        run: |
          pyinstaller --noconfirm --windowed --name "DataMind" \
            --collect-submodules numpy \
            --collect-submodules pandas \
            --collect-submodules openpyxl \
            --add-data "templates:templates" \
            --add-data "static:static" \
            web_portal.py
      - name: Package app bundle with Mac guide
        run: |
          cp USER_GUIDE_MAC.txt dist/USER_GUIDE.txt
          ditto -c -k --keepParent dist/DataMind.app "DataMind-${{ github.ref_name }}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: DataMind-${{ github.ref_name }}-macos-arm64.zip

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/DataMind-*-windows-x64.exe
            artifacts/**/DataMind-*-windows-x64.zip
            artifacts/**/DataMind-*-macos-arm64.zip
          generate_release_notes: true
