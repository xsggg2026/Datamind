name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller==6.11.1

      - name: Build single-file executable
        run: |
          pyinstaller --noconfirm --onefile --name "DataMind" `
            --collect-submodules numpy `
            --collect-submodules pandas `
            --collect-submodules openpyxl `
            --add-data "templates;templates" `
            --add-data "static;static" `
            web_portal.py

      - name: Rename artifact
        run: Move-Item dist/DataMind.exe "DataMind-${{ github.ref_name }}-windows-x64.exe"

      - name: Package exe with user guide
        run: |
          Copy-Item "使用说明.txt" "dist/使用说明.txt"
          Compress-Archive -Path "dist/DataMind-${{ github.ref_name }}-windows-x64.exe", "dist/使用说明.txt" `
            -DestinationPath "DataMind-${{ github.ref_name }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            DataMind-*-windows-x64.exe
            DataMind-*-windows-x64.zip

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DataMind-*-windows-x64.exe
            DataMind-*-windows-x64.zip
          generate_release_notes: true
